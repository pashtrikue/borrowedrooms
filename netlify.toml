# Netlify build settings (picked up automatically when the repo is connected).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.5"

# Long-lived caching for hashed assets (images, videos, CSS, JS).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
